name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: the update-health job asks about the published release, which can go wrong
  # (a deleted asset, a re-signed build) without anybody pushing a commit.
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift --version
      - name: Build
        run: swift build
      - name: Test whole drops over loopback
        # A real listener and a real sender on 127.0.0.1: a folder arriving identical, a
        # declined drop, name collisions, an interrupted drop continuing, a hostile manifest.
        run: swift test
      - name: What must not compile, does not
        # The access control the secrets and the authority sit behind: each of these small
        # programs is refused by the compiler, for the reason it must give.
        run: python3 scripts/test-capabilities.py
      - name: Smoke-run the command line
        # The runner has no second Mac and no window server; the engine still has to pair two
        # identities and move a folder from one process to another, and every command has to
        # exit 0.
        run: |
          bin=.build/debug/NimbusDrop
          run() { perl -e 'alarm shift; exec @ARGV' 120 "$@"; }
          run "$bin" --print
          # Two identities on one Mac are two Macs to each other: refused while unpaired, then
          # paired with two codes, a folder accepted on the terminal and compared, one declined.
          run python3 scripts/cli-smoke.py "$bin"
          run "$bin" --render-icon /tmp/icon.png --size 256
          run "$bin" --dump-bar /tmp/bar.png
      - name: Build release
        run: swift build -c release

  # Signing lives on the owner's machine, so CI cannot run the full preflight (it needs a
  # Developer ID build). It can ask the other half: does what this source declares still match
  # what is actually published? A pull request that changes the bundle identifier or the team
  # would strand every installed copy on the release they have — silently, forever.
  update-health:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the updater
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: njoubert/nimbus-updater
          path: .updater
      - name: Read the identity this source declares
        id: declared
        run: |
          bundle_id=$(grep -m1 '^BUNDLE_ID=' build.sh | cut -d= -f2)
          team=$(grep -m1 'static let teamID' Sources/NimbusDrop/Updates.swift | cut -d'"' -f2)
          name=$(grep -m1 '^APP_NAME=' build.sh | cut -d'"' -f2)
          prefix=$(grep -m1 '^NAME=' build.sh | cut -d= -f2 | awk '{print $1}')
          echo "bundle_id=$bundle_id" >> "$GITHUB_OUTPUT"
          echo "team=$team" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix-" >> "$GITHUB_OUTPUT"
          echo "declared: $bundle_id / $team / $name / $prefix-"
      - name: The published release must still carry an installable zip
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          swift run --package-path .updater updaterctl check \
            --repo "$GITHUB_REPOSITORY" --prefix "${{ steps.declared.outputs.prefix }}" --require-asset
      - name: The published release must match the identity this source declares
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          swift run --package-path .updater updaterctl released-identity \
            --repo "$GITHUB_REPOSITORY" --app-name "${{ steps.declared.outputs.name }}" \
            --prefix "${{ steps.declared.outputs.prefix }}" \
            --expect-bundle-id "${{ steps.declared.outputs.bundle_id }}" \
            --expect-team "${{ steps.declared.outputs.team }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Shellcheck
        run: shellcheck build.sh
      - name: The engine's layers
        # Each module depends on what Package.swift and scripts/check-layers.py both say, imports
        # only the system frameworks its layer may, and NimbusCrypto stays pure.
        run: python3 scripts/check-layers.py
      - name: The layer checker itself, against trees with one thing wrong
        run: python3 scripts/test-check-layers.py

  # The formal models that run in seconds: every TLA+ specification in formal/tla with TLC,
  # every mutant of one (each must fail, on the property named for it), the check that the
  # Swift pairing machine's transition relation (formal/tla/PairingImpl.tla, which `swift test`
  # holds to the code) is the specification's, and the short-code simulation.
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: The runner's own judgement, against canned tool output
        # A missing lemma, a summary cut short, a mutant that survived, a wrong exit code: each
        # must be refused. No prover is run.
        run: python3 formal/test_check.py
      - name: The lemma register against the theories
        # Every lemma written is required and every lemma required is written (no prover).
        run: python3 formal/check.py register
      - name: The short codes, by simulation and by counting
        run: python3 formal/sas-bound.py
      - name: TLA+ models and their mutants
        run: python3 formal/check.py tla

  # The Tamarin proofs take minutes and a Homebrew install, so not on every push: weekly and
  # on request. `./build.sh verify` runs them on the owner's Mac. (This job had not yet been
  # seen to run when it was written, 2026-11-24.)
  proofs:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Tamarin
        # Homebrew loads nothing from a tap it has not been told to trust, and the prover
        # needs the tap's `maude` as well: installing alone trusts the one formula named and
        # then refuses the other (the first run of this job, 2026-11-24).
        run: |
          brew tap tamarin-prover/tap
          brew trust tamarin-prover/tap
          brew install tamarin-prover/tap/tamarin-prover
          tamarin-prover --version
      - name: Tamarin models and their mutants
        run: python3 formal/check.py tamarin
