name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build
        run: swift build
      - name: Test whole drops over loopback
        # A real listener and a real sender on 127.0.0.1: a folder arriving identical, a
        # declined drop, name collisions, an interrupted drop continuing, a hostile manifest.
        run: swift test
      - name: Smoke-run the command line
        # The runner has no second Mac and no window server; the engine still has to move a
        # folder from one process to another and every command has to exit 0.
        run: |
          bin=.build/debug/NimbusDrop
          run() { perl -e 'alarm shift; exec @ARGV' 120 "$@"; }
          run "$bin" --print
          mkdir -p /tmp/nd-src/sub /tmp/nd-dst
          head -c 20000000 /dev/urandom > /tmp/nd-src/big.bin
          echo hello > /tmp/nd-src/sub/small.txt
          "$bin" --receive /tmp/nd-dst --once --no-advertise --name ci-receiver --port 47999 &
          sleep 2
          run "$bin" --name ci-sender --send 127.0.0.1:47999 /tmp/nd-src
          wait
          diff -r /tmp/nd-src /tmp/nd-dst/nd-src
          run "$bin" --render-icon /tmp/icon.png --size 256
          run "$bin" --dump-bar /tmp/bar.png
      - name: Build release
        run: swift build -c release

  # Once a release is published, add the siblings' update-health job here: it checks that the
  # published release still carries the updater's zip and matches the declared bundle id and team.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck build.sh
