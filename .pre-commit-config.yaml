# prek / pre-commit hooks: `prek install` once, then every commit is checked.
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: check-yaml
    -   id: check-added-large-files
        args: ["--maxkb=2048"]
    -   id: check-merge-conflict
-   repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
    -   id: shellcheck
-   repo: local
    hooks:
    # The engine's modules, held to what each may depend on and touch (see Package.swift).
    -   id: layers
        name: the engine's layers
        entry: python3 scripts/check-layers.py
        language: system
        pass_filenames: false
        files: ^(Sources/|Package\.swift|scripts/check-layers\.py)
